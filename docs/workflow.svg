<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">交稿、试听、确认后生成</title><desc id="desc">用户确认正文与试听，Skill 处理朗读计划和生成。内容或设置变化后重新试听。</desc>
<g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif"><rect x="0" y="0" width="1200" height="390" rx="20" fill="#f5f1e8" stroke="none"/><text x="36" y="54" font-size="26" fill="#334e45" font-weight="600">从确认稿到完整音频</text><rect x="36" y="86" width="352" height="210" rx="16" fill="#fffdf8" stroke="#cbd6cc"/><text x="60" y="127" font-size="24" fill="#698376" font-weight="600">01</text><text x="60" y="170" font-size="32" fill="#173e32" font-weight="700">交一份确认稿</text><text x="60" y="219" font-size="22" fill="#172f2b" font-weight="400">你：确认可朗读的正文</text><text x="60" y="257" font-size="22" fill="#172f2b" font-weight="400">Skill：核对读法与分段</text><path d="M394 190 H416 m-8 -7 8 7 -8 7" fill="none" stroke="#759385" stroke-width="3"/><rect x="424" y="86" width="352" height="210" rx="16" fill="#fffdf8" stroke="#cbd6cc"/><text x="448" y="127" font-size="24" fill="#698376" font-weight="600">02</text><text x="448" y="170" font-size="32" fill="#173e32" font-weight="700">先听短试听</text><text x="448" y="219" font-size="22" fill="#172f2b" font-weight="400">Skill：生成试听 WAV</text><text x="448" y="257" font-size="22" fill="#172f2b" font-weight="400">你：听音色、语速和停顿</text><path d="M782 190 H804 m-8 -7 8 7 -8 7" fill="none" stroke="#759385" stroke-width="3"/><rect x="812" y="86" width="352" height="210" rx="16" fill="#dfebe2" stroke="#cbd6cc"/><text x="836" y="127" font-size="24" fill="#698376" font-weight="600">03</text><text x="836" y="170" font-size="32" fill="#173e32" font-weight="700">确认后生成</text><text x="836" y="219" font-size="22" fill="#172f2b" font-weight="400">你：明确接受试听</text><text x="836" y="257" font-size="22" fill="#172f2b" font-weight="400">Skill：生成完整口播 WAV</text><path d="M1000 310 V344 H590 m10 -7 -10 7 10 7" fill="none" stroke="#859b8a" stroke-width="2"/><text x="52" y="352" font-size="23" fill="#415f50" font-weight="400">正文、计划或声音设置变了，就重新试听</text></g>
</svg>
