<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 790" role="img" aria-labelledby="title desc">
<title id="title">口播音频生成流程</title><desc id="desc">三步纵向流程：确认稿件，听短试听，明确接受后生成完整 WAV。</desc>
<g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif"><rect x="0" y="0" width="440" height="790" rx="20" fill="#f5f1e8" stroke="none"/><text x="26" y="48" font-size="25" fill="#334e45" font-weight="600">从确认稿到完整音频</text><rect x="24" y="76" width="392" height="188" rx="14" fill="#fffdf8" stroke="#cbd6cc"/><text x="44" y="117" font-size="22" fill="#698376" font-weight="600">01</text><text x="91" y="118" font-size="27" fill="#173e32" font-weight="700">交一份确认稿</text><text x="44" y="174" font-size="22" fill="#172f2b" font-weight="400">你：确认可朗读的正文</text><text x="44" y="215" font-size="22" fill="#172f2b" font-weight="400">Skill：核对读法与分段</text><path d="M220 269 v19 m-7 -7 7 7 7 -7" fill="none" stroke="#759385" stroke-width="3"/><rect x="24" y="294" width="392" height="188" rx="14" fill="#fffdf8" stroke="#cbd6cc"/><text x="44" y="335" font-size="22" fill="#698376" font-weight="600">02</text><text x="91" y="336" font-size="27" fill="#173e32" font-weight="700">先听短试听</text><text x="44" y="392" font-size="22" fill="#172f2b" font-weight="400">Skill：生成试听 WAV</text><text x="44" y="433" font-size="22" fill="#172f2b" font-weight="400">你：听音色、语速和停顿</text><path d="M220 487 v19 m-7 -7 7 7 7 -7" fill="none" stroke="#759385" stroke-width="3"/><rect x="24" y="512" width="392" height="188" rx="14" fill="#dfebe2" stroke="#cbd6cc"/><text x="44" y="553" font-size="22" fill="#698376" font-weight="600">03</text><text x="91" y="554" font-size="27" fill="#173e32" font-weight="700">确认后生成</text><text x="44" y="610" font-size="22" fill="#172f2b" font-weight="400">你：明确接受试听</text><text x="44" y="651" font-size="22" fill="#172f2b" font-weight="400">Skill：生成完整口播 WAV</text><text x="28" y="744" font-size="21" fill="#415f50" font-weight="400">正文、计划或声音设置变了，</text><text x="28" y="774" font-size="21" fill="#415f50" font-weight="400">就重新试听。</text></g>
</svg>
